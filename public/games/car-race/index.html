<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Star Racer</title><link rel="stylesheet" href="race.css"></head><body><main class="racer"><div class="hud"><span>STARS <strong id="stars">0</strong></span><span id="hearts" aria-label="3 hearts">♥ ♥ ♥</span><button id="pause" disabled>Ⅱ Pause</button></div><label class="journey">FINISH LINE <progress id="distance" max="6000" value="0" aria-label="Distance to finish"></progress><span aria-hidden="true">🏁</span></label><div class="track"><canvas id="road" width="360" height="540" aria-label="Three-lane car racing track. Use the steering buttons or left and right arrow keys."></canvas><div id="overlay" class="overlay"><div class="welcome-icon">🏎️</div><p class="eyebrow">READY, LITTLE RACER?</p><h1 id="title">Let’s go on a<br>star adventure.</h1><p id="message">Collect golden stars. Steer around the cars.<br>You have three hearts and lots of room to try!</p><button id="start" class="start">Let’s race →</button></div></div><div class="controls"><button id="left" aria-label="Steer left">← <span>Left</span></button><span class="keys">← → arrow keys<br>Space to pause</span><button id="right" aria-label="Steer right"><span>Right</span> →</button></div><p id="status" role="status" aria-live="polite">Choose Let’s race to begin. Tap the big arrows or use your keyboard.</p></main><script src="engine.js"></script><script src="race.js"></script></body></html>
